[project]
# Single env that runs RoboTwin's simulator AND the barrel PiZero-FM / Qwen3-VL model in one process,
# so policy/pizero_vlam/deploy_policy.py can be imported directly by script/eval_policy.py.
#
# Sources reconciled here:
#   - RoboTwin sim         : script/requirements.txt + script/_install.sh
#   - RoboTwin (barrel's)  : barrel/components/inference/robots/robotwin/pyproject.toml
#   - VLAM model           : barrel/components/inference/models/vlams/pyproject.toml
#   - barrel.core.databib  : barrel/core/databib/pyproject.toml   (the only barrel dep the
#                            self-contained hf_export/ model code actually imports)
#
# cp310 is not optional: sapien==3.0.0b1 and the pinned torch/torchvision/flash_attn wheels below are
# all cp310 manylinux builds.
name = "robotwin-pizero-vlam-eval"
version = "0.0.0"
requires-python = "~=3.10.0"

dependencies = [
    # ---------------------------------------------------------------- RoboTwin simulator
    "sapien==3.0.0b1",       # RoboTwin pins sapien-3 (NOT the 2.x that SimplerEnv uses)
    "mplib==0.2.1",          # TOPP time-parameterization -- take_action(action_type='qpos') needs this
    "gymnasium==0.29.1",
    "transforms3d==0.4.2",
    "trimesh==4.4.3",
    "open3d==0.18.0",        # RoboTwin's pin; barrel/train asks for 0.19.0 but only the sim needs it
    "scipy==1.10.1",
    "h5py",
    "imageio[ffmpeg]",
    "av",
    "pyglet<2",
    "opencv-python-headless",
    "matplotlib",
    "termcolor",
    "moviepy",
    "zarr",
    "pydantic",

    # ---------------------------------------------------------------- VLAM model
    # torch 2.7 rather than RoboTwin's requirements.txt torch==2.4.1: that pin exists for the bundled
    # baselines (DP/ACT/...), not for sapien or mplib, and the exported model was built against 2.7.
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.0%2Bcu128-cp310-cp310-manylinux_2_28_x86_64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu128/torchvision-0.22.0%2Bcu128-cp310-cp310-manylinux_2_28_x86_64.whl",
    "transformers==4.57.3",
    "timm==1.0.15",
    "roma==1.5.0",
    "sentencepiece==0.2.0",
    "einops",
    "pandas==2.2.3",
    "huggingface_hub==0.25.0",
    "pillow",
    "backports.strenum==1.3.1",

    # FK (proprio) / IK (control). Must be the same version the dataset converter used, so the Piper
    # link6 chain at eval is identical to the one at training.
    "pytorch-kinematics==0.7.6",

    # ---------------------------------------------------------------- barrel.core.databib + common
    "PyYAML>=6.0",
    "deepdiff>=6.7.1",
    "frozendict>=2.4.4",
    "python-dateutil>=2.8.2",
    "psutil",  # barrel.core.common.platform reads cpu_count at import

    # ---------------------------------------------------------------- CONFLICT, resolved deliberately
    # sapien-3's native extensions are built against numpy<2, so this pin is hard on the sim side.
    # barrel/components/inference/models/vlams/pyproject.toml pins numpy==2.2.4, but nothing in the
    # model path needs 2.x (torch 2.7 and transformers 4.57 both support 1.26). The sim wins.
    # If anything in the model path turns out to require numpy 2, this env cannot be unified and you
    # must fall back to policy/Your_Policy/deploy_policy_double_env.py (model and sim in separate envs
    # over a socket).
    "numpy>=1.26.4,<2.0.0",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------------------------------
# curobo: REQUIRED, but not installable from this file.
#
# envs/robot/robot.py:257 set_planner() constructs CuroboPlanner unconditionally -- there is no
# planner_type branch guarding it -- and script/eval_policy.py calls TASK_ENV.play_once() for the
# expert check on every seed, which drives that planner. So eval cannot run without curobo. (Note this
# differs from barrel/components/inference/robots/robotwin/, which claims curobo is decoupled: that is
# true only because its env bypasses take_action/play_once entirely.)
#
# It needs --no-build-isolation, so install it after the env exists, per script/_install.sh:
#     git clone --branch v0.7.8 --depth 1 https://github.com/NVlabs/curobo.git
#     cd curobo && pip install -e . --no-build-isolation
#     pip install warp-lang==1.12.0 setuptools==69.5.1
curobo-postinstall = [
    "warp-lang==1.12.0",
    "setuptools==69.5.1",
]

# Only needed if the exported model_config.yaml carries attn_implementation: flash_attention_2 (the
# training config does). Check <session>/hf_export/<id>/src/model_config.yaml first -- if it says sdpa,
# skip this. Version-locked to cu12 + torch 2.7 + cp310; needs --no-build-isolation.
flash-attn = [
    "flash_attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.7cxx11abiFALSE-cp310-cp310-linux_x86_64.whl",
    "xformers @ https://download.pytorch.org/whl/cu128/xformers-0.0.30-cp310-cp310-manylinux_2_28_x86_64.whl",
]

# Deliberately NOT a dependency. script/_install.sh builds pytorch3d from git, but it is imported only
# by envs/camera/camera.py for point-cloud farthest-point sampling, behind a try/except that just
# prints "missing pytorch3d". This policy does not collect point clouds, so skip the source build.
pointcloud = [
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@stable",
]

# RoboTwin's requirements.txt also lists openai / azure / wandb / ffmpeg, used only by its description
# and data-generation tooling, not by eval.
description-tools = [
    "openai",
    "azure-ai-inference",
    "wandb",
]
